        independent_run: true
        independent_reuse: true
        independent_eval: true
      notes: 时间维度独立意图明确（"什么时候"）；近邻负例=不给价格买卖点（U2/U3）；过拟合警示进 B 段

  - capability_id: cap.gann-45-years-skill.swing-charts
    revision: 1
    status: active
    slug: gann-swing-charts-skill
    title: 3日图与9点摆动图维护及信号
    importance: high
    importance_rationale: task-06+task-07；U3/U4 的标准化信号源；维护口径在 ch7 逐条给出并用 1940-1949 九年序列完整示范；464次/292次统计给出幅度概率
    one_liner: 3日图只记≥3日的运动（破3日底=看跌、穿3日头=看涨）；9点图只记≥9点的摆动（反弹不足9点=弱势）；点位阈值须按现代波动率重标定
    intents:
      - 用日线数据维护3日摆动图并读取信号
      - 维护9点摆动图并判断强弱
      - 评估当前摆动幅度处于历史分布的什么位置（9~21点占50%+）
      - 选择该用月图/周图/日图/摆动图哪一层
    keywords: [3日图, 9点图, 摆动图, 摆动, 趋势线, 波动过滤, swing-chart, 3-day-chart, 9-point, swing]
    also_read: [cap.gann-45-years-skill.trend-safe-entry, cap.gann-45-years-skill.time-cycle-calendar]
    card: cards/gann-swing-charts-skill.md
    frontmatter:
      description: |
        江恩3日摆动图与9点摆动图的维护规则与信号读取（含月/周/日图分层选择）。只产出图表信号与强弱结论，不做开仓决策与仓位。
        何时用：用户提供日线高低价序列要求画摆动图、问"3日图破位了吗""9点图什么信号""该用周线还是月线"。
        语言信号：3日图、9点、摆动、swing chart。需要完整买卖决策时转趋势确认能力，仓位转风控能力。
      tags: [procedure, charting, swing]
    source_evidence:

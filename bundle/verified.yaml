        生成变盘时间窗口日历与调整时间层级判断（江恩规则4/8/10+第5/8/9章）。何时用：用户问"接下来哪些日子要变盘"
        "这波调整多久算到位""时间上平衡过度了吗"。语言信号：时间周期、变盘日、周年纪念日、调整几周、time-cycle、timing。
        只输出窗口清单与到位判断，不预测方向；原书参数为1949年前道指归纳，正式使用需以自有数据重建。
